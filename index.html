<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-top: #2a1446;
      --bg-bottom: #0d0718;
      --ink: #fff4e6;
      --accent: #ffb84d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 30%, var(--bg-top), var(--bg-bottom) 70%);
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
    }
    canvas { display: block; touch-action: none; }
    .title {
      position: fixed; top: 6vh; left: 0; right: 0;
      text-align: center; pointer-events: none;
      font-family: "Pacifico", cursive;
      font-size: clamp(2rem, 7vw, 4.5rem);
      text-shadow: 0 0 24px rgba(255, 184, 77, .55);
    }
    .title small {
      display: block; font-family: "Nunito", sans-serif; font-weight: 700;
      font-size: clamp(1rem, 3vw, 1.5rem); color: var(--accent); margin-top: .25em;
    }
    .hint {
      position: fixed; bottom: 4vh; left: 16px; right: 16px;
      text-align: center; opacity: .75; font-size: .95rem; pointer-events: none;
      transition: opacity .6s;
    }
    button.relight {
      position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%);
      padding: .7em 1.4em; border: 0; border-radius: 999px;
      background: var(--accent); color: #2a1446; font: 700 1rem "Nunito", sans-serif;
      cursor: pointer; display: none;
    }
  </style>
</head>
<body>
  <h1 class="title">Happy Birthday<small id="name"></small></h1>
  <p class="hint" id="hint">Drag to spin the cake · Click the cake to blow out the candles 🎂</p>
  <button class="relight" id="relight">Light the candles again</button>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Name shown under the title: use ?name=Alice in the URL, or edit the fallback here.
    const params = new URLSearchParams(location.search);
    document.getElementById("name").textContent = params.get("name") || "";

    // ---------- Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 9.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.autoRotate = true;          // the cake turns by itself
    controls.autoRotateSpeed = 1.6;

    scene.add(new THREE.HemisphereLight(0xffe9d6, 0x2a1446, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(4, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    scene.add(key);

    // ---------- Cake ----------
    const cake = new THREE.Group();
    scene.add(cake);

    const mat = (color, rough = 0.6) => new THREE.MeshStandardMaterial({ color, roughness: rough });

    // plate
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(3.1, 2.9, 0.15, 64), mat(0xf4f1ee, 0.3));
    plate.position.y = 0.075;
    plate.receiveShadow = true;
    cake.add(plate);

    // tiers: radius, height, sponge color, frosting color
    const tiers = [
      { r: 2.3, h: 1.2, body: 0xf7c6d9, drip: 0xffffff },
      { r: 1.6, h: 1.0, body: 0xfff1d6, drip: 0xff8fb8 },
    ];
    let y = 0.15;
    tiers.forEach((t) => {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(t.r, t.r, t.h, 64), mat(t.body));
      body.position.y = y + t.h / 2;
      body.castShadow = body.receiveShadow = true;
      cake.add(body);

      // frosting cap
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(t.r + 0.04, t.r + 0.04, 0.12, 64), mat(t.drip, 0.35));
      cap.position.y = y + t.h;
      cap.castShadow = true;
      cake.add(cap);

      // drips around the edge
      const drips = 28;
      for (let i = 0; i < drips; i++) {
        const a = (i / drips) * Math.PI * 2;
        const len = 0.18 + Math.random() * 0.35;
        const drip = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, len, 4, 8), mat(t.drip, 0.35));
        drip.position.set(Math.cos(a) * (t.r + 0.02), y + t.h - len / 2, Math.sin(a) * (t.r + 0.02));
        cake.add(drip);
      }

      // piped frosting balls along the bottom edge
      const beads = Math.round(t.r * 16);
      for (let i = 0; i < beads; i++) {
        const a = (i / beads) * Math.PI * 2;
        const bead = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), mat(t.drip, 0.35));
        bead.position.set(Math.cos(a) * t.r, y + 0.06, Math.sin(a) * t.r);
        cake.add(bead);
      }
      y += t.h;
    });
    const topY = y + 0.06;

    // sprinkles on top
    const sprinkleColors = [0xff4d6d, 0x4dd2ff, 0xffd84d, 0x7cff6b, 0xb07cff];
    const sprinkleGeo = new THREE.CapsuleGeometry(0.025, 0.1, 2, 6);
    for (let i = 0; i < 90; i++) {
      const s = new THREE.Mesh(sprinkleGeo, mat(sprinkleColors[i % sprinkleColors.length], 0.4));
      const r = Math.sqrt(Math.random()) * 1.45, a = Math.random() * Math.PI * 2;
      s.position.set(Math.cos(a) * r, topY + 0.02, Math.sin(a) * r);
      s.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI);
      cake.add(s);
    }

    // strawberries on the lower tier ledge
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + 0.2;
      const berry = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 12), mat(0xe8233f, 0.3));
      berry.rotation.x = Math.PI;
      berry.position.set(Math.cos(a) * 1.95, 0.15 + 1.2 + 0.2, Math.sin(a) * 1.95);
      cake.add(berry);
    }

    // ---------- Candles ----------
    const candles = [];
    const candleColors = [0x6ecbff, 0xff8fb8, 0xffd84d, 0x9cff8f, 0xc49cff];
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xffc04d, transparent: true, opacity: 0.95 });
    candleColors.forEach((c, i) => {
      const a = (i / candleColors.length) * Math.PI * 2;
      const g = new THREE.Group();
      g.position.set(Math.cos(a) * 0.9, topY, Math.sin(a) * 0.9);

      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.8, 16), mat(c, 0.4));
      stick.position.y = 0.4;
      stick.castShadow = true;
      g.add(stick);

      const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.1, 6), mat(0x222222));
      wick.position.y = 0.85;
      g.add(wick);

      const flame = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), flameMat.clone());
      flame.scale.set(1, 2, 1);
      flame.position.y = 1.0;
      g.add(flame);

      const light = new THREE.PointLight(0xffa640, 0.6, 4, 2);
      light.position.y = 1.05;
      g.add(light);

      cake.add(g);
      candles.push({ flame, light, phase: Math.random() * 10 });
    });

    // ---------- Confetti ----------
    const confetti = [];
    const confGeo = new THREE.PlaneGeometry(0.08, 0.14);
    function burstConfetti() {
      for (let i = 0; i < 220; i++) {
        const m = new THREE.Mesh(confGeo, new THREE.MeshBasicMaterial({
          color: sprinkleColors[i % sprinkleColors.length], side: THREE.DoubleSide,
        }));
        m.position.set(0, topY + 1, 0);
        const a = Math.random() * Math.PI * 2, speed = 2 + Math.random() * 4;
        m.userData.v = new THREE.Vector3(Math.cos(a) * speed * 0.5, 4 + Math.random() * 4, Math.sin(a) * speed * 0.5);
        m.userData.spin = new THREE.Vector3(Math.random() * 8, Math.random() * 8, 0);
        scene.add(m);
        confetti.push(m);
      }
    }

    // ---------- Interaction ----------
    let lit = true;
    const hint = document.getElementById("hint");
    const relight = document.getElementById("relight");
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downAt = null;

    renderer.domElement.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener("pointerup", (e) => {
      if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6 || !lit) return;
      pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.intersectObject(cake, true).length) blowOut();
    });

    function blowOut() {
      lit = false;
      candles.forEach((c) => { c.flame.visible = false; c.light.intensity = 0; });
      burstConfetti();
      hint.style.opacity = 0;
      relight.style.display = "block";
    }
    relight.addEventListener("click", () => {
      lit = true;
      candles.forEach((c) => { c.flame.visible = true; });
      relight.style.display = "none";
      hint.style.opacity = .75;
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      if (lit) candles.forEach((c) => {
        const f = 1 + Math.sin(t * 18 + c.phase) * 0.08 + Math.sin(t * 7 + c.phase) * 0.06;
        c.flame.scale.set(f, 2 * f, f);
        c.light.intensity = 0.5 + 0.15 * f;
      });

      for (let i = confetti.length - 1; i >= 0; i--) {
        const m = confetti[i];
        m.userData.v.y -= 6 * dt;
        m.userData.v.multiplyScalar(0.99);
        m.position.addScaledVector(m.userData.v, dt);
        m.rotation.x += m.userData.spin.x * dt;
        m.rotation.y += m.userData.spin.y * dt;
        if (m.position.y < -2) { scene.remove(m); m.material.dispose(); confetti.splice(i, 1); }
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
